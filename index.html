  <style>
    #loader {
      position: fixed;
      inset: 0;
      background: #0A0A0A;
      color: #F2EDE0;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-direction: column;
      gap: 24px;
      z-index: 9999;
      transition: transform 0.8s cubic-bezier(0.86, 0, 0.07, 1);
    }

    #loader.gone {
      transform: translateY(-100%);
    }

    #loader .big {
      font-family: "Archivo Black", "Helvetica Neue", sans-serif;
      font-size: clamp(40px, 9vw, 100px);
      line-height: 0.88;
      text-transform: uppercase;
      letter-spacing: -0.04em;
    }

    @media(min-width: 600px) {
      #loader .big {
        font-family: "Archivo Black", "Helvetica Neue", sans-serif;
        font-size: clamp(80px, 18vw, 200px);
        line-height: 0.88;
        text-transform: uppercase;
        letter-spacing: -0.04em;
      }
    }

    #loader .bar {
      width: 200px;
      height: 2px;
      background: rgba(242, 237, 224, 0.2);
      overflow: hidden;
    }

    #loader .bar>i {
      display: block;
      height: 100%;
      background: #FF2D00;
      animation: ld 1.2s ease-out forwards;
    }

    #loader .mono-sm {
      font-family: "JetBrains Mono", monospace;
      font-size: 12px;
      letter-spacing: 0.02em;
      text-transform: uppercase;
    }

    @keyframes ld {
      from {
        width: 0;
      }

      to {
        width: 100%;
      }
    }
  </style>
